<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - MusicFree</title>
    <style id="theme-vars">
:root {
  /* === Brand Colors === */
  --color-bg: #0a0a0a;
  --color-bg-elevated: #141414;
  --color-surface: #1a1a1a;
  --color-surface-hover: #222222;
  --color-primary: #1DB954;
  --color-primary-hover: #1ed760;
  --color-primary-muted: rgba(29, 185, 84, 0.12);
  --color-text: #ffffff;
  --color-text-secondary: rgba(255, 255, 255, 0.55);
  --color-text-tertiary: rgba(255, 255, 255, 0.3);
  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-strong: rgba(255, 255, 255, 0.14);
  --color-divider: rgba(255, 255, 255, 0.06);
  --color-switch-off: #3a3a3c;
  --color-danger: #ef4444;
  --color-warning: #f59e0b;
  --color-info: #3b82f6;
  --color-success: #1DB954;

  /* === Semantic Aliases (required by fill-html-head.mjs) === */
  --color-background: var(--color-bg);
  --color-foreground: var(--color-text);
  --color-card: var(--color-surface);
  --color-muted: rgba(255, 255, 255, 0.04);
  --color-muted-foreground: var(--color-text-secondary);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);

  /* === Typography === */
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

  --text-xs: 11px;
  --text-xs-lh: 16px;
  --text-sm: 13px;
  --text-sm-lh: 18px;
  --text-base: 15px;
  --text-base-lh: 22px;
  --text-lg: 17px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.15);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-primary: var(--color-primary);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--color-background); }
      .text-background { color: var(--color-background); }
      .border-background { border-color: var(--color-background); }
      .ring-background { --tw-ring-color: var(--color-background); }
      .bg-foreground { background-color: var(--color-foreground); }
      .text-foreground { color: var(--color-foreground); }
      .border-foreground { border-color: var(--color-foreground); }
      .ring-foreground { --tw-ring-color: var(--color-foreground); }
      .bg-card { background-color: var(--color-card); }
      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }
      .ring-card { --tw-ring-color: var(--color-card); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased">
    <main class="mx-auto max-w-[430px] min-h-screen relative" style="background: var(--color-bg);">

      <!-- Scrollable Content -->
      <div class="pb-[140px]">

        <!-- 1. Status Bar (44px) -->
        <div class="flex items-center justify-between px-5 h-[44px] pt-[env(safe-area-inset-top,0px)]" style="color: var(--color-text);">
          <span class="text-[15px] font-semibold tracking-tight">21:52</span>
          <div class="flex items-center gap-[6px]" style="color: var(--color-text);">
            <!-- Wifi icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
              <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
              <circle cx="12" cy="20" r="1"/>
            </svg>
            <!-- Battery icon -->
            <svg width="22" height="16" viewBox="0 0 28 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="3.5" width="22" height="9" rx="2"/>
              <path d="M24 7v2" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="3" y="5.5" width="16" height="5" rx="1" fill="var(--color-text)" stroke="none"/>
            </svg>
          </div>
        </div>

        <!-- 2. Navigation Header -->
        <div class="flex items-center justify-between px-5 h-12">
          <!-- Hamburger Menu -->
          <button class="w-10 h-10 flex items-center justify-center rounded-[var(--radius-md)]" style="color: var(--color-text);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <!-- Title -->
          <h1 class="text-[17px] font-bold" style="color: var(--color-text);">星玲音乐</h1>
          <!-- Bell Icon -->
          <button class="w-10 h-10 flex items-center justify-center rounded-[var(--radius-md)] relative" style="color: var(--color-text);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
            <!-- Notification dot -->
            <span class="absolute top-[7px] right-[7px] w-[7px] h-[7px] rounded-full" style="background: var(--color-primary);"></span>
          </button>
        </div>

        <!-- 3. Search Bar -->
        <div class="mx-5 mb-5" data-dom-id="nav-search">
          <div class="flex items-center h-11 rounded-full px-4" style="background: var(--color-surface);">
            <!-- Magnifying Glass Icon -->
            <svg class="mr-3 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span class="text-[13px]" style="color: var(--color-text-tertiary);">点击这里开始搜索</span>
          </div>
        </div>

        <!-- 4. Quick Action Grid (2x2) -->
        <div class="grid grid-cols-2 gap-3 mx-4">

          <!-- Card: 发现新歌 -->
          <div class="flex items-center gap-3 rounded-2xl h-[88px] px-3" style="background: rgba(232, 93, 78, 0.15);">
            <div class="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style="background: rgba(232, 93, 78, 0.2);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E85D4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="10 8 16 12 10 16 10 8" fill="#E85D4E" stroke="none"/>
              </svg>
            </div>
            <div class="min-w-0">
              <div class="text-[15px] font-bold text-white leading-tight">发现新歌</div>
              <div class="text-[12px] mt-0.5 leading-tight" style="color: var(--color-text-secondary);">每日推荐新曲</div>
            </div>
          </div>

          <!-- Card: 热门排行 -->
          <div class="flex items-center gap-3 rounded-2xl h-[88px] px-3" style="background: rgba(201, 162, 39, 0.15);">
            <div class="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style="background: rgba(201, 162, 39, 0.2);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 010-5H6"/>
                <path d="M18 9h1.5a2.5 2.5 0 000-5H18"/>
                <path d="M4 22h16"/>
                <path d="M10 22V8"/>
                <path d="M14 22V4"/>
                <path d="M6 4h12v5H6z" fill="rgba(201,162,39,0.2)" stroke="#C9A227" stroke-width="1.5"/>
              </svg>
            </div>
            <div class="min-w-0">
              <div class="text-[15px] font-bold text-white leading-tight">热门排行</div>
              <div class="text-[12px] mt-0.5 leading-tight" style="color: var(--color-text-secondary);">实时热度榜单</div>
            </div>
          </div>

          <!-- Card: 最近播放 -->
          <div class="flex items-center gap-3 rounded-2xl h-[88px] px-3" style="background: rgba(45, 158, 143, 0.15);">
            <div class="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style="background: rgba(45, 158, 143, 0.2);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D9E8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="min-w-0">
              <div class="text-[15px] font-bold text-white leading-tight">最近播放</div>
              <div class="text-[12px] mt-0.5 leading-tight" style="color: var(--color-text-secondary);">继续收听记录</div>
            </div>
          </div>

          <!-- Card: 本地音乐 -->
          <div class="flex items-center gap-3 rounded-2xl h-[88px] px-3" style="background: rgba(46, 139, 87, 0.15);">
            <div class="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style="background: rgba(46, 139, 87, 0.2);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                <path d="M10 13v-2" stroke-width="1.5"/>
                <path d="M14 13v-4" stroke-width="1.5"/>
                <path d="M18 13V9" stroke-width="1.5"/>
              </svg>
            </div>
            <div class="min-w-0">
              <div class="text-[15px] font-bold text-white leading-tight">本地音乐</div>
              <div class="text-[12px] mt-0.5 leading-tight" style="color: var(--color-text-secondary);">管理本地歌曲</div>
            </div>
          </div>

        </div>

        <!-- Action Buttons Row -->
        <div class="flex gap-3 mx-4 mt-3">
          <!-- 导入歌单 (border style) -->
          <button class="flex-1 flex items-center justify-center gap-2 h-11 rounded-xl" style="border: 1px solid var(--color-border-strong);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span class="text-[13px] font-medium" style="color: var(--color-text-secondary);">导入歌单</span>
          </button>
          <!-- 新建歌单 (filled style) -->
          <button class="flex-1 flex items-center justify-center gap-2 h-11 rounded-xl" style="background: var(--color-primary-muted);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span class="text-[13px] font-medium" style="color: var(--color-primary);">新建歌单</span>
          </button>
        </div>

        <!-- 5. Playlist Section -->
        <!-- Section Header -->
        <div class="flex items-center mx-5 mt-7 mb-3">
          <h2 class="text-[17px] font-bold text-white">我的歌单</h2>
          <span class="ml-2 w-[18px] h-[18px] rounded-full flex items-center justify-center text-[11px] font-bold text-white" style="background: var(--color-primary);">1</span>
        </div>

        <!-- Tab Pills -->
        <div class="flex gap-2 mx-5 mb-4">
          <button class="rounded-full px-4 py-2 text-[13px] font-semibold text-white" style="background: var(--color-primary);">我的歌单 1</button>
          <button class="rounded-full px-4 py-2 text-[13px] font-semibold" style="background: var(--color-surface); color: var(--color-text-secondary);">收藏歌单 0</button>
        </div>

        <!-- Playlist List -->
        <div class="mx-4">
          <div class="flex items-center rounded-[var(--radius-lg)] h-[72px] px-3" style="background: var(--color-surface);">
            <!-- Placeholder Cover -->
            <div class="w-12 h-12 rounded-[10px] shrink-0 flex items-center justify-center" style="background: linear-gradient(135deg, #2a2a3a, #3a2a4a);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white" fill-opacity="0.5" stroke="none">
                <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
              </svg>
            </div>
            <!-- Playlist Info -->
            <div class="ml-3 flex-1 min-w-0">
              <div class="text-[15px] font-bold text-white">我喜欢</div>
              <div class="text-[12px] mt-0.5" style="color: var(--color-text-secondary);">0首</div>
            </div>
            <!-- Chevron -->
            <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        </div>

      </div><!-- end scrollable content -->

      <!-- 6. Mini Player Bar -->
      <div class="fixed bottom-16 left-0 right-0 z-40" style="background: var(--color-bg-elevated); border-top: 1px solid var(--color-border);">
        <div class="mx-auto max-w-[430px] flex items-center h-16 px-4">
          <!-- Album Art Placeholder -->
          <div class="w-11 h-11 rounded-[10px] shrink-0" style="background: linear-gradient(135deg, #3a2a4a, #2a3a4a);"></div>
          <!-- Song Info -->
          <div class="ml-3 flex-1 min-w-0">
            <div class="text-[14px] text-white truncate">不胜喜欢</div>
            <div class="text-[12px] mt-0.5 truncate" style="color: var(--color-text-secondary);">枳冉Stella, 艺暄</div>
          </div>
          <!-- Play Button -->
          <button class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 ml-3" style="background: var(--color-primary);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
              <polygon points="6 3 20 12 6 21 6 3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 7. Bottom Tab Bar -->
      <div class="fixed bottom-0 left-0 right-0 z-50" style="background: var(--color-bg-elevated); border-top: 1px solid var(--color-border);">
        <div class="mx-auto max-w-[430px] flex items-center justify-center h-16 gap-16">
          <!-- 首页 (active) -->
          <button class="flex flex-col items-center gap-0.5">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="text-[10px] font-medium" style="color: var(--color-primary);">首页</span>
            <span class="w-1 h-1 rounded-full" style="background: var(--color-primary);"></span>
          </button>
          <!-- 我的 (inactive) -->
          <button class="flex flex-col items-center gap-0.5">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="text-[10px] font-medium" style="color: var(--color-text-tertiary);">我的</span>
          </button>
        </div>
      </div>

    </main>
</body>
</html>
