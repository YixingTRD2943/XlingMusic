<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - MusicFree</title>
    <style id="theme-vars">
:root {
  --color-bg: #0a0a0a;
  --color-bg-elevated: #141414;
  --color-surface: #1a1a1a;
  --color-surface-hover: #222222;
  --color-primary: #1DB954;
  --color-primary-hover: #1ed760;
  --color-primary-muted: rgba(29, 185, 84, 0.12);
  --color-text: #ffffff;
  --color-text-secondary: rgba(255, 255, 255, 0.55);
  --color-text-tertiary: rgba(255, 255, 255, 0.3);
  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-strong: rgba(255, 255, 255, 0.14);
  --color-divider: rgba(255, 255, 255, 0.06);
  --color-switch-off: #3a3a3c;
  --color-danger: #ef4444;
  --color-warning: #f59e0b;
  --color-info: #3b82f6;
  --color-success: #1DB954;
  --color-background: var(--color-bg);
  --color-foreground: var(--color-text);
  --color-card: var(--color-surface);
  --color-muted: rgba(255, 255, 255, 0.04);
  --color-muted-foreground: var(--color-text-secondary);
  --color-radius-sm: 6px;
  --color-radius-md: 10px;
  --color-radius-lg: 14px;
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  --text-xs: 11px;
  --text-xs-lh: 16px;
  --text-sm: 13px;
  --text-sm-lh: 18px;
  --text-base: 15px;
  --text-base-lh: 22px;
  --text-lg: 17px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;
  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.15);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-primary: var(--color-primary);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--color-background); }
      .text-background { color: var(--color-background); }
      .border-background { border-color: var(--color-background); }
      .ring-background { --tw-ring-color: var(--color-background); }
      .bg-foreground { background-color: var(--color-foreground); }
      .text-foreground { color: var(--color-foreground); }
      .border-foreground { border-color: var(--color-foreground); }
      .ring-foreground { --tw-ring-color: var(--color-foreground); }
      .bg-card { background-color: var(--color-card); }
      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }
      .ring-card { --tw-ring-color: var(--color-card); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="mx-auto max-w-[430px]" style="background: var(--color-bg); padding-bottom: 140px;">

        <!-- Status Bar -->
        <div class="flex items-center justify-between px-5" style="height: 44px;">
            <span style="color: var(--color-text); font-size: 15px; font-weight: 600;">21:52</span>
            <div class="flex items-center gap-1.5">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                <svg width="22" height="12" viewBox="0 0 28 14" fill="none">
                    <rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="white" stroke-opacity="0.4"/>
                    <rect x="25" y="4" width="2.5" height="5.5" rx="1" fill="white" fill-opacity="0.4"/>
                    <rect x="2" y="2" width="19" height="9" rx="1.5" fill="white" fill-opacity="0.8"/>
                </svg>
            </div>
        </div>

        <!-- Navigation Header -->
        <div class="flex items-center justify-center relative" style="height: 48px; padding: 0 20px;">
            <div class="absolute left-5 top-1/2 -translate-y-1/2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </div>
            <span style="color: var(--color-text); font-size: 17px; font-weight: 700;">我的</span>
        </div>

        <!-- Profile Card -->
        <div class="mx-4 mt-4" style="background: var(--color-surface); border-radius: 16px; padding: 24px 20px;">
            <div class="flex items-center">
                <div class="shrink-0 flex items-center justify-center" style="width: 56px; height: 56px; border-radius: 9999px; background: linear-gradient(135deg, #1DB954, #17a34a);">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="flex-1" style="margin-left: 16px;">
                    <div style="color: var(--color-text); font-size: 18px; font-weight: 700;">星玲音乐</div>
                    <div style="color: var(--color-text-secondary); font-size: 13px; margin-top: 4px;">享受音乐的美好</div>
                </div>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-tertiary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>
            <div class="flex items-center justify-around" style="margin-top: 20px;">
                <div class="flex-1 text-center">
                    <div style="color: var(--color-text); font-size: 18px; font-weight: 700;">1</div>
                    <div style="color: var(--color-text-secondary); font-size: 11px; margin-top: 2px;">歌单</div>
                </div>
                <div style="width: 1px; height: 28px; background: var(--color-border);"></div>
                <div class="flex-1 text-center">
                    <div style="color: var(--color-text); font-size: 18px; font-weight: 700;">0</div>
                    <div style="color: var(--color-text-secondary); font-size: 11px; margin-top: 2px;">收藏</div>
                </div>
                <div style="width: 1px; height: 28px; background: var(--color-border);"></div>
                <div class="flex-1 text-center">
                    <div style="color: var(--color-text); font-size: 18px; font-weight: 700;">0</div>
                    <div style="color: var(--color-text-secondary); font-size: 11px; margin-top: 2px;">下载</div>
                </div>
            </div>
        </div>

        <!-- Menu Section Title -->
        <div style="padding: 24px 20px 10px; color: var(--color-text-secondary); font-size: 13px; font-weight: 600;">我的音乐</div>

        <!-- Menu Card Group -->
        <div class="mx-4" style="background: var(--color-surface); border-radius: 14px;">

            <!-- Item 1: 我喜欢 -->
            <div class="flex items-center" style="height: 56px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
                <div class="shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(239,68,68,0.15);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>
                <span class="flex-1" style="color: var(--color-text); font-size: 15px; margin-left: 14px;">我喜欢</span>
                <span style="color: var(--color-text-tertiary); font-size: 13px;">0</span>
            </div>

            <!-- Item 2: 播放历史 -->
            <div class="flex items-center" style="height: 56px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
                <div class="shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(59,130,246,0.15);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span class="flex-1" style="color: var(--color-text); font-size: 15px; margin-left: 14px;">播放历史</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-tertiary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>

            <!-- Item 3: 下载管理 -->
            <div class="flex items-center" style="height: 56px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
                <div class="shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(245,158,11,0.15);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </div>
                <span class="flex-1" style="color: var(--color-text); font-size: 15px; margin-left: 14px;">下载管理</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-tertiary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>

            <!-- Item 4: 本地音乐 -->
            <div class="flex items-center" style="height: 56px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
                <div class="shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(29,185,84,0.15);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                </div>
                <span class="flex-1" style="color: var(--color-text); font-size: 15px; margin-left: 14px;">本地音乐</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-tertiary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>

            <!-- Item 5: 收藏歌单 -->
            <div class="flex items-center" style="height: 56px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
                <div class="shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(168,85,247,0.15);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                </div>
                <span class="flex-1" style="color: var(--color-text); font-size: 15px; margin-left: 14px;">收藏歌单</span>
                <span style="color: var(--color-text-tertiary); font-size: 13px;">0</span>
            </div>

            <!-- Item 6: 设置 -->
            <div class="flex items-center" style="height: 56px; padding: 0 16px;">
                <div class="shrink-0 flex items-center justify-center" style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(255,255,255,0.08);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <span class="flex-1" style="color: var(--color-text); font-size: 15px; margin-left: 14px;">设置</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-tertiary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>

        </div>

    </main>

    <!-- Mini Player Bar (fixed, bottom 64px) -->
    <div class="fixed left-1/2 -translate-x-1/2 flex items-center" style="bottom: 64px; width: 100%; max-width: 430px; height: 64px; background: var(--color-bg-elevated); border-top: 1px solid var(--color-border); padding: 0 12px 0 16px;">
        <div class="shrink-0" style="width: 44px; height: 44px; border-radius: 8px; background: var(--color-surface);"></div>
        <div class="flex-1 min-w-0" style="margin-left: 12px;">
            <div class="truncate" style="color: var(--color-text); font-size: 14px; font-weight: 600;">未在播放</div>
            <div class="truncate" style="color: var(--color-text-secondary); font-size: 12px; margin-top: 2px;">--</div>
        </div>
        <div class="shrink-0 flex items-center justify-center" style="width: 40px; height: 40px; border-radius: 9999px; background: var(--color-primary);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </div>
        <div class="shrink-0 flex items-center justify-center" style="margin-left: 8px; width: 36px; height: 36px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-secondary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </div>
    </div>

    <!-- Bottom Tab Bar (fixed, bottom 0) -->
    <div class="fixed left-1/2 -translate-x-1/2 flex items-center justify-around" style="bottom: 0; width: 100%; max-width: 430px; height: 64px; background: var(--color-bg-elevated); border-top: 1px solid var(--color-border);">
        <!-- 首页 tab -->
        <div class="flex flex-col items-center justify-center" style="flex: 1;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="color: var(--color-text-tertiary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span style="color: var(--color-text-tertiary); font-size: 10px; margin-top: 2px;">首页</span>
        </div>
        <!-- 我的 tab (active) -->
        <div class="flex flex-col items-center justify-center" style="flex: 1;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="color: var(--color-primary);" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <div class="flex items-center gap-1" style="margin-top: 2px;">
                <div style="width: 4px; height: 4px; border-radius: 9999px; background: var(--color-primary);"></div>
                <span style="color: var(--color-primary); font-size: 10px; font-weight: 600;">我的</span>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
