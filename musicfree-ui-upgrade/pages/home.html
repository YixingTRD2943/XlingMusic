<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFree 首页</title>
    <style id="theme-vars">
:root {
  /* ── Brand Prefix: mf ── */

  /* ── Color System ── */
  --mf-bg: #0a0a0a;
  --mf-bg-elevated: #141414;
  --mf-surface: #1a1a1a;
  --mf-surface-hover: #252525;
  --mf-surface-active: #2a2a2a;

  --mf-text-primary: #ffffff;
  --mf-text-secondary: #b3b3b3;
  --mf-text-tertiary: #727272;
  --mf-text-inverse: #0a0a0a;

  --mf-brand: #1DB954;
  --mf-brand-hover: #1ed760;
  --mf-brand-muted: rgba(29, 185, 84, 0.15);
  --mf-brand-subtle: rgba(29, 185, 84, 0.08);

  --mf-gradient-start: #1DB954;
  --mf-gradient-mid: #1ed760;
  --mf-gradient-end: #169c46;

  /* ── Semantic Colors ── */
  --state-success: #1DB954;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* ── Border & Divider ── */
  --mf-border: rgba(255, 255, 255, 0.08);
  --mf-border-strong: rgba(255, 255, 255, 0.15);
  --mf-divider: rgba(255, 255, 255, 0.06);

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: "Circular Std", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Circular Std", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.02em;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ── Shadow (restrained: alpha <= 0.05 for static) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.25);

  /* ── Transition ── */
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;

  /* ── Z-Index ── */
  --z-base: 0;
  --z-surface: 10;
  --z-bar: 100;
  --z-overlay: 200;
  --z-modal: 300;
}

/* ── Typography Classes ── */
.mf-display {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--mf-text-primary);
}

.mf-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--mf-text-primary);
}

.mf-headline {
  font-family: var(--font-body);
  font-size: var(--text-xl);
  font-weight: 600;
  line-height: var(--leading-tight);
  color: var(--mf-text-primary);
}

.mf-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  line-height: var(--leading-normal);
  color: var(--mf-text-primary);
}

.mf-body-secondary {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 400;
  line-height: var(--leading-normal);
  color: var(--mf-text-secondary);
}

.mf-caption {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: var(--leading-normal);
  color: var(--mf-text-tertiary);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

.mf-label {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: var(--leading-normal);
  color: var(--mf-text-secondary);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--mf-border);
  }
  @layer base {
    body { background: var(--mf-surface); color: var(--mf-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-[160px] min-h-screen" style="background: var(--mf-bg);">

      <!-- Status Bar -->
      <div class="flex items-center justify-between px-5 h-11" style="background: var(--mf-bg);">
        <span class="mf-caption" style="color: var(--mf-text-secondary); font-size: 11px;">9:41</span>
        <div class="flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-secondary);"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-secondary);"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          <svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 24 14" style="color: var(--mf-text-secondary);"><rect x="1" y="4" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="20" y="6" width="2" height="6" rx="1"/><rect x="3" y="6" width="10" height="6" rx="1"/></svg>
        </div>
      </div>

      <!-- Top Navigation Bar -->
      <header class="flex items-center justify-between px-4 h-14" style="background: var(--mf-bg);">
        <button class="inline-flex items-center justify-center w-10 h-10 rounded-lg transition-colors duration-150 hover:bg-[var(--mf-surface-hover)] active:scale-95" aria-label="菜单">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-primary);"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="mf-headline" style="font-size: var(--text-lg); letter-spacing: var(--tracking-tight);">MusicFree</h1>
        <button class="inline-flex items-center justify-center w-10 h-10 rounded-lg transition-colors duration-150 hover:bg-[var(--mf-surface-hover)] active:scale-95" aria-label="通知">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-primary);"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </header>

      <!-- Search Bar -->
      <div class="px-4 pb-4">
        <div class="flex items-center gap-3 h-10 px-4 rounded-full transition-colors duration-150" style="background: var(--mf-surface);">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-tertiary);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="mf-body-secondary truncate" style="color: var(--mf-text-tertiary);">搜索歌曲、歌手、歌单</span>
        </div>
      </div>

      <!-- Quick Action Cards (Horizontal Scroll) -->
      <section class="px-4 pb-6">
        <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1" style="-webkit-overflow-scrolling: touch;">

          <!-- Card: 发现新歌 -->
          <a href="#" class="shrink-0 w-[260px] h-[96px] rounded-lg overflow-hidden relative flex items-center px-4 gap-3 transition-transform duration-150 active:scale-[0.98]" style="background: linear-gradient(135deg, #e8573a 0%, #f2994a 100%);">
            <img src="../assets/card-discover.jpg" alt="发现新歌" class="absolute inset-0 w-full h-full object-cover opacity-30" loading="lazy">
            <div class="relative z-10 flex items-center gap-3 w-full">
              <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
              </div>
              <div class="min-w-0">
                <div class="text-white font-semibold text-sm leading-tight truncate" style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);">发现新歌</div>
                <div class="text-white/80 text-xs mt-0.5 truncate" style="text-shadow: 0 1px 2px rgba(0,0,0,0.2);">每日推荐新曲</div>
              </div>
            </div>
          </a>

          <!-- Card: 热门排行 -->
          <a href="#" class="shrink-0 w-[260px] h-[96px] rounded-lg overflow-hidden relative flex items-center px-4 gap-3 transition-transform duration-150 active:scale-[0.98]" style="background: linear-gradient(135deg, #c8913a 0%, #e8b931 100%);">
            <img src="../assets/card-charts.jpg" alt="热门排行" class="absolute inset-0 w-full h-full object-cover opacity-30" loading="lazy">
            <div class="relative z-10 flex items-center gap-3 w-full">
              <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
              </div>
              <div class="min-w-0">
                <div class="text-white font-semibold text-sm leading-tight truncate" style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);">热门排行</div>
                <div class="text-white/80 text-xs mt-0.5 truncate" style="text-shadow: 0 1px 2px rgba(0,0,0,0.2);">实时热度榜单</div>
              </div>
            </div>
          </a>

          <!-- Card: 最近播放 -->
          <a href="#" class="shrink-0 w-[260px] h-[96px] rounded-lg overflow-hidden relative flex items-center px-4 gap-3 transition-transform duration-150 active:scale-[0.98]" style="background: linear-gradient(135deg, #2d9e8f 0%, #34c9a8 100%);">
            <img src="../assets/card-history.jpg" alt="最近播放" class="absolute inset-0 w-full h-full object-cover opacity-30" loading="lazy">
            <div class="relative z-10 flex items-center gap-3 w-full">
              <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <div class="min-w-0">
                <div class="text-white font-semibold text-sm leading-tight truncate" style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);">最近播放</div>
                <div class="text-white/80 text-xs mt-0.5 truncate" style="text-shadow: 0 1px 2px rgba(0,0,0,0.2);">继续收听记录</div>
              </div>
            </div>
          </a>

          <!-- Card: 本地音乐 -->
          <a href="#" class="shrink-0 w-[260px] h-[96px] rounded-lg overflow-hidden relative flex items-center px-4 gap-3 transition-transform duration-150 active:scale-[0.98]" style="background: linear-gradient(135deg, #2e8b57 0%, #4caf50 100%);">
            <div class="absolute inset-0 w-full h-full" style="background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 60%);"></div>
            <div class="relative z-10 flex items-center gap-3 w-full">
              <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </div>
              <div class="min-w-0">
                <div class="text-white font-semibold text-sm leading-tight truncate" style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);">本地音乐</div>
                <div class="text-white/80 text-xs mt-0.5 truncate" style="text-shadow: 0 1px 2px rgba(0,0,0,0.2);">管理本地歌曲</div>
              </div>
            </div>
          </a>

        </div>
      </section>

      <!-- Tab Switcher -->
      <section class="px-4 pb-4">
        <div class="flex gap-2 mb-3">
          <button class="inline-flex items-center justify-center h-8 px-4 rounded-full text-sm font-semibold whitespace-nowrap transition-colors duration-150" style="background: var(--mf-brand); color: var(--mf-text-inverse);">
            我的歌单
            <span class="ml-1.5 inline-flex items-center justify-center h-4 min-w-4 px-1 rounded-full text-xs font-medium" style="background: rgba(0,0,0,0.2); color: white;">3</span>
          </button>
          <button class="inline-flex items-center justify-center h-8 px-4 rounded-full text-sm font-semibold whitespace-nowrap transition-colors duration-150 hover:bg-[var(--mf-surface-hover)]" style="background: transparent; color: var(--mf-text-secondary);">
            收藏歌单
          </button>
        </div>
        <div class="h-px" style="background: var(--mf-divider);"></div>
      </section>

      <!-- Playlist List -->
      <section class="px-4">
        <div class="flex flex-col">

          <!-- Playlist Item 1: 周杰伦 -->
          <a href="#" class="flex items-center gap-3 py-3 transition-colors duration-150 hover:bg-[var(--mf-surface-hover)] rounded-lg px-1" data-dom-id="nav-playlist" style="text-decoration: none; color: inherit;">
            <img src="../assets/cover-jaychou.jpg" alt="周杰伦" class="w-[72px] h-[72px] rounded-lg object-cover shrink-0" loading="lazy">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-sm truncate" style="color: var(--mf-text-primary);">周杰伦</div>
              <div class="text-xs mt-1 truncate" style="color: var(--mf-text-secondary);">196首</div>
            </div>
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-tertiary);"><polyline points="9 18 15 12 9 6"/></svg>
          </a>

          <div class="mx-1 h-px" style="background: var(--mf-divider);"></div>

          <!-- Playlist Item 2: 随机 -->
          <a href="#" class="flex items-center gap-3 py-3 transition-colors duration-150 hover:bg-[var(--mf-surface-hover)] rounded-lg px-1" data-dom-id="nav-playlist" style="text-decoration: none; color: inherit;">
            <img src="../assets/cover-random.jpg" alt="随机" class="w-[72px] h-[72px] rounded-lg object-cover shrink-0" loading="lazy">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-sm truncate" style="color: var(--mf-text-primary);">随机</div>
              <div class="text-xs mt-1 truncate" style="color: var(--mf-text-secondary);">100首</div>
            </div>
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-tertiary);"><polyline points="9 18 15 12 9 6"/></svg>
          </a>

          <div class="mx-1 h-px" style="background: var(--mf-divider);"></div>

          <!-- Playlist Item 3: Lo-Fi -->
          <a href="#" class="flex items-center gap-3 py-3 transition-colors duration-150 hover:bg-[var(--mf-surface-hover)] rounded-lg px-1" data-dom-id="nav-playlist" style="text-decoration: none; color: inherit;">
            <img src="../assets/cover-lofi.jpg" alt="Lo-Fi" class="w-[72px] h-[72px] rounded-lg object-cover shrink-0" loading="lazy">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-sm truncate" style="color: var(--mf-text-primary);">Lo-Fi</div>
              <div class="text-xs mt-1 truncate" style="color: var(--mf-text-secondary);">42首</div>
            </div>
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-tertiary);"><polyline points="9 18 15 12 9 6"/></svg>
          </a>

        </div>
      </section>

      <!-- Mini Player Bar (Fixed, above bottom nav) -->
      <div class="fixed left-0 right-0 z-50" style="bottom: 60px; background: rgba(20,20,20,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--mf-border);" data-dom-id="nav-player">
        <a href="#" class="flex items-center gap-3 px-4 h-16 w-full" style="text-decoration: none; color: inherit;">
          <img src="../assets/cover-jaychou.jpg" alt="以父之名" class="w-10 h-10 rounded-lg object-cover shrink-0" loading="lazy">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate" style="color: var(--mf-text-primary);">以父之名</div>
            <div class="text-xs mt-0.5 truncate" style="color: var(--mf-text-secondary);">周杰伦</div>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <button class="inline-flex items-center justify-center w-9 h-9 rounded-full transition-transform duration-150 active:scale-90" style="background: var(--mf-brand);" aria-label="暂停">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" style="color: white;"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            </button>
            <button class="inline-flex items-center justify-center w-9 h-9 rounded-full transition-colors duration-150 hover:bg-[var(--mf-surface-hover)]" aria-label="播放列表">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--mf-text-secondary);"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </a>
      </div>

      <!-- Bottom Navigation Bar (Fixed) -->
      <nav class="fixed left-0 right-0 bottom-0 z-50 flex items-center justify-around h-[60px]" style="background: var(--mf-bg-elevated); border-top: 1px solid var(--mf-border);">
        <button class="flex flex-col items-center justify-center gap-0.5 px-4 py-1 transition-colors duration-150" aria-label="首页" aria-current="page">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" style="color: var(--mf-brand);"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          <span class="text-xs font-medium" style="color: var(--mf-brand);">首页</span>
          <span class="w-1 h-1 rounded-full" style="background: var(--mf-brand);"></span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 px-4 py-1 transition-colors duration-150 hover:opacity-80" data-dom-id="tab-profile" aria-label="我的">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="color: var(--mf-text-tertiary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-xs font-medium" style="color: var(--mf-text-tertiary);">我的</span>
        </button>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
