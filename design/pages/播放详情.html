<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放详情</title>
    <style id="theme-vars">
:root {
  /* ── Brand Prefix: mf ── */

  /* ── Color System ── */
  --mf-bg: #0a0a0a;
  --mf-bg-elevated: #141414;
  --mf-surface: #1a1a1a;
  --mf-surface-hover: #252525;
  --mf-surface-active: #2a2a2a;

  --mf-text-primary: #ffffff;
  --mf-text-secondary: #b3b3b3;
  --mf-text-tertiary: #727272;
  --mf-text-inverse: #0a0a0a;

  --mf-brand: #1DB954;
  --mf-brand-hover: #1ed760;
  --mf-brand-muted: rgba(29, 185, 84, 0.15);
  --mf-brand-subtle: rgba(29, 185, 84, 0.08);

  --mf-gradient-start: #1DB954;
  --mf-gradient-mid: #1ed760;
  --mf-gradient-end: #169c46;

  /* ── Semantic Colors ── */
  --state-success: #1DB954;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* ── Border & Divider ── */
  --mf-border: rgba(255, 255, 255, 0.08);
  --mf-border-strong: rgba(255, 255, 255, 0.15);
  --mf-divider: rgba(255, 255, 255, 0.06);

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: "Circular Std", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Circular Std", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.02em;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ── Shadow (restrained: alpha <= 0.05 for static) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
  --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.25);

  /* ── Transition ── */
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;

  /* ── Z-Index ── */
  --z-base: 0;
  --z-surface: 10;
  --z-bar: 100;
  --z-overlay: 200;
  --z-modal: 300;
}

/* ── Typography Classes ── */
.mf-display {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--mf-text-primary);
}

.mf-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--mf-text-primary);
}

.mf-headline {
  font-family: var(--font-body);
  font-size: var(--text-xl);
  font-weight: 600;
  line-height: var(--leading-tight);
  color: var(--mf-text-primary);
}

.mf-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  line-height: var(--leading-normal);
  color: var(--mf-text-primary);
}

.mf-body-secondary {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 400;
  line-height: var(--leading-normal);
  color: var(--mf-text-secondary);
}

.mf-caption {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: var(--leading-normal);
  color: var(--mf-text-tertiary);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

.mf-label {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: var(--leading-normal);
  color: var(--mf-text-secondary);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--mf-border);
  }
  @layer base {
    body { background: var(--mf-surface); color: var(--mf-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased overflow-hidden" style="background: var(--mf-bg);">
    <main class="relative w-full h-screen flex flex-col items-center justify-between" style="background: var(--mf-bg);">

      <!-- Blurred background image layer -->
      <div class="absolute inset-0 z-0 overflow-hidden" aria-hidden="true">
        <img src="../assets/image_6_yi19x4.jpg" alt="" class="w-full h-full object-cover" style="filter: blur(60px) brightness(0.4);">
        <div class="absolute inset-0" style="background: rgba(0,0,0,0.5);"></div>
      </div>

      <!-- Top navigation bar -->
      <nav class="relative z-10 w-full flex items-center justify-between px-5 pt-3 pb-1">
        <button data-dom-id="back-to-home" class="inline-flex items-center justify-center w-10 h-10 rounded-full transition-opacity duration-150 hover:opacity-70 active:opacity-50" aria-label="返回首页" style="color: rgba(255,255,255,0.7);">
          <i data-lucide="chevron-down" class="w-6 h-6"></i>
        </button>
        <span class="mf-caption" style="color: rgba(255,255,255,0.5); text-transform: none; letter-spacing: normal;">正在播放</span>
        <button class="inline-flex items-center justify-center w-10 h-10 rounded-full transition-opacity duration-150 hover:opacity-70 active:opacity-50" aria-label="分享" style="color: rgba(255,255,255,0.7);">
          <i data-lucide="share-2" class="w-5 h-5"></i>
        </button>
      </nav>

      <!-- Album art (hero focal point) -->
      <section class="relative z-10 flex-shrink-0 flex items-center justify-center" style="margin-top: 16px;">
        <img src="../assets/image_7_yi19x4.jpg" alt="以父之名 专辑封面" class="w-[280px] h-[280px] rounded-[16px] object-cover" style="box-shadow: 0 20px 60px rgba(0,0,0,0.2);">
      </section>

      <!-- Song info -->
      <section class="relative z-10 w-full flex-shrink-0 px-6 flex items-center justify-between" style="margin-top: 24px;">
        <div class="min-w-0 flex-1">
          <h1 class="mf-headline truncate" style="font-size: var(--text-xl); word-break: keep-all;">以父之名</h1>
          <p class="mf-body-secondary truncate" style="margin-top: 2px;">周杰伦</p>
        </div>
        <button class="inline-flex items-center justify-center w-10 h-10 rounded-full flex-shrink-0 transition-opacity duration-150 hover:opacity-70 active:opacity-50" aria-label="喜欢" style="color: var(--mf-text-secondary); margin-left: 12px;">
          <i data-lucide="heart" class="w-5 h-5"></i>
        </button>
      </section>

      <!-- Progress bar -->
      <section class="relative z-10 w-full flex-shrink-0 px-6" style="margin-top: 24px;">
        <div class="w-full flex items-center gap-3">
          <span class="mf-body-secondary flex-shrink-0" style="font-size: var(--text-xs); color: var(--mf-text-tertiary); min-width: 28px;">1:34</span>
          <div class="flex-1 relative flex items-center" style="height: 4px;">
            <!-- Track background -->
            <div class="w-full rounded-full" style="height: 2px; background: rgba(255,255,255,0.2);"></div>
            <!-- Filled portion -->
            <div class="absolute left-0 rounded-full" style="width: 35%; height: 2px; background: var(--mf-brand);"></div>
            <!-- Draggable thumb -->
            <div class="absolute rounded-full transition-transform duration-150" style="left: calc(35% - 6px); width: 12px; height: 12px; background: var(--mf-text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.3);"></div>
          </div>
          <span class="mf-body-secondary flex-shrink-0" style="font-size: var(--text-xs); color: var(--mf-text-tertiary); min-width: 28px; text-align: right;">4:23</span>
        </div>
      </section>

      <!-- Playback controls -->
      <section class="relative z-10 flex-shrink-0 w-full flex items-center justify-center" style="margin-top: 20px;">
        <div class="flex items-center justify-center w-full" style="max-width: 320px;">
          <!-- Shuffle -->
          <button class="inline-flex items-center justify-center w-10 h-10 rounded-full transition-colors duration-150 hover:opacity-80 active:opacity-60" aria-label="随机播放" style="color: var(--mf-text-secondary);">
            <i data-lucide="shuffle" class="w-5 h-5"></i>
          </button>
          <!-- Previous -->
          <button class="inline-flex items-center justify-center w-12 h-12 rounded-full transition-opacity duration-150 hover:opacity-80 active:opacity-60" aria-label="上一首" style="color: var(--mf-text-primary); margin-left: 16px;">
            <i data-lucide="skip-back" class="w-7 h-7" style="fill: currentColor;"></i>
          </button>
          <!-- Play/Pause (primary CTA) -->
          <button class="inline-flex items-center justify-center rounded-full transition-transform duration-200 hover:scale-105 active:scale-95" aria-label="暂停" style="width: 64px; height: 64px; background: var(--mf-brand); color: var(--mf-text-inverse); margin-left: 20px;">
            <i data-lucide="pause" class="w-7 h-7" style="fill: currentColor;"></i>
          </button>
          <!-- Next -->
          <button class="inline-flex items-center justify-center w-12 h-12 rounded-full transition-opacity duration-150 hover:opacity-80 active:opacity-60" aria-label="下一首" style="color: var(--mf-text-primary); margin-left: 20px;">
            <i data-lucide="skip-forward" class="w-7 h-7" style="fill: currentColor;"></i>
          </button>
          <!-- Repeat -->
          <button class="inline-flex items-center justify-center w-10 h-10 rounded-full transition-colors duration-150 hover:opacity-80 active:opacity-60" aria-label="循环播放" style="color: var(--mf-text-secondary); margin-left: 16px;">
            <i data-lucide="repeat" class="w-5 h-5"></i>
          </button>
        </div>
      </section>

      <!-- Bottom utility row -->
      <section class="relative z-10 flex-shrink-0 w-full flex items-center justify-center px-6" style="margin-top: 20px; gap: 48px;">
        <button class="flex flex-col items-center gap-1 transition-opacity duration-150 hover:opacity-70 active:opacity-50" aria-label="歌词">
          <i data-lucide="text" class="w-5 h-5" style="color: var(--mf-text-secondary);"></i>
          <span style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--mf-text-tertiary);">词</span>
        </button>
        <button class="flex flex-col items-center gap-1 transition-opacity duration-150 hover:opacity-70 active:opacity-50" aria-label="播放列表">
          <i data-lucide="list-music" class="w-5 h-5" style="color: var(--mf-text-secondary);"></i>
          <span style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--mf-text-tertiary);">列表</span>
        </button>
        <button class="flex flex-col items-center gap-1 transition-opacity duration-150 hover:opacity-70 active:opacity-50" aria-label="更多选项">
          <i data-lucide="more-horizontal" class="w-5 h-5" style="color: var(--mf-text-secondary);"></i>
          <span style="font-family: var(--font-body); font-size: var(--text-xs); color: var(--mf-text-tertiary);">更多</span>
        </button>
      </section>

      <!-- Home indicator -->
      <div class="relative z-10 flex-shrink-0 flex justify-center" style="margin-top: 8px; margin-bottom: 4px;">
        <div class="rounded-full" style="width: 134px; height: 5px; background: rgba(255,255,255,0.3);"></div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
